# Data schema and leakage allowlist. Merged into base.yaml; profiles may not override any of it.
#
# Column names checked against the real metadata table (all 27 match, 2026-10-11). Text-section
# classes, label file and the rules below approved by Zeinab on 2026-10-11 (docs/DECISIONS.md).

data:
  metadata_file: df_chexpert_plus_240401.parquet   # relative to data.root (csv also readable)
  radgraph_dir: radgraph                       # RadGraph XL files, relative to data.root
  # report_fixed.json is NOT usable: its labels are not aligned with its image paths (checked
  # 2026-10-11, agreement at chance level). impression_fixed is used instead.
  labels_file: impression_fixed.json
  label_aggregation: priority                  # images of a study disagree in 380 studies (364 after the drop)
  study_overlap_policy: drop_patients          # 366 patients have studies interleaved in time
  columns:
    image_path: path_to_image                  # relative path, e.g. train/patient00001/study1/view1_frontal.jpg
    patient_id: deid_patient_id
    study_order: patient_report_date_order     # ranks IMAGES within a patient; a study starts at its min
    view: frontal_lateral
    source_split: split
  frontal_value: Frontal
  radiologist_split_value: valid               # dataset split value marking the radiologist-read subset
  radiologist_policy: holdout                  # holdout = never in train/val/test
  pilot_min_pos_per_finding: 5                 # stratified pilot sampling target per finding

  # Allowlist. A column that is not listed here is never read as text. The loader also refuses to
  # start if any column in FORBIDDEN_INDEX_ALWAYS (text_inputs.py) appears under allowed_index.
  text_sections:
    allowed_index:            # index (current) study: pre-read text only
      - section_clinical_history
      - section_history
      - section_technique
    allowed_prior:            # studies strictly earlier than the index study: the full report
      - section_clinical_history
      - section_history
      - section_technique
      - section_comparison
      - section_procedure_comments
      - section_narrative
      - section_findings
      - section_impression
      - section_end_of_impression
      - section_summary
  demographics: [age, sex]    # added to the index text; race is never a model input
  no_pre_read_token: "[NO PRE-READ TEXT]"
  leakage_check:              # scripts/15_check_leakage.py (audit only, counts only)
    min_snippet_chars: 20     # shorter report pieces ("none", "normal") are too generic to signal a leak

# scripts/09_fetch_raw.py (run by Zeinab). Table refs are copied from the Redivis table pages.
fetch:
  labels_table: aimi.chexpert_plus:5yyj:v1_0.chexpert_labels:pmec
  label_files: [findings_fixed.json, impression_fixed.json, report_fixed.json]
  metadata_table: aimi.chexpert_plus:5yyj:v1_0.df_chexpert_plus_240401:bavj   # 223,462 rows, 27 vars
  radgraph_table: aimi.chexpert_plus:5yyj:v1_0.radgraph_xl_annotations:8wdv   # 09_fetch_raw --radgraph
  radgraph_files: [section_findings.json, section_impression.json]   # RadGraph XL was run per section
  png_train_table: aimi.chexpert_plus:5yyj:v1_0.png_train:s6cj
  png_valid_table: aimi.chexpert_plus:5yyj:v1_0.png_valid:41v9
