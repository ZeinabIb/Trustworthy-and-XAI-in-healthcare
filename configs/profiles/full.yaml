# full: university GPU server. All reported results come from this profile. Never reads artifacts/pilot/.
data:
  root: null              # server path (user-set), or env MFSI_DATA_ROOT
  pilot_patients: 20000   # Zeinab 2026-10-30
  image_format: png       # Zeinab 2026-10-30
image:
  size: 224
train:
  device: auto
  batch_size: 32          # placeholder: set from GPU memory
  num_workers: 8
  epochs: 10
  precision: bf16
  seeds: [0, 1, 2]
arbiter:
  model: null             # chosen 7-14B open-weight model (STOP-AND-ASK, Phase 5)
  endpoint: null
eval:
  bootstrap_B: 2000
preflight:
  min_free_disk_gb: 100   # checked before and after the PNG download; room for artifacts
  min_free_gpu_gb: 10     # RTX 4070, 12 GB
