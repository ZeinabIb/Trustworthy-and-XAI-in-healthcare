# pilot: real CheXpert Plus subset (laptop, now the RTX 4070 PC). Results are throw-away (never used for scientific decisions).
data:
  root: null            # user-set local path (outside the repo, encrypted), or env MFSI_DATA_ROOT
  pilot_patients: 500
  image_format: png
image:
  size: 224
train:
  device: auto          # cuda on the RTX 4070 PC; the laptop falls back to cpu
  batch_size: 16        # worst-case bag peaks at ~4 GiB on the 12 GB RTX 4070 (bf16)
  num_workers: 4
  epochs: 3
  precision: bf16       # ignored on cpu
  seeds: [0]
arbiter:
  model: qwen2.5:7b-instruct-q4_K_M   # Zeinab 2026-10-15: pilot plumbing model (Ollama tag)
  endpoint: http://127.0.0.1:11434/v1  # local Ollama, OpenAI-compatible API; never a remote host
  model_digest: null                   # set after `ollama pull` (script 52 prints the digest it finds)
eval:
  bootstrap_B: 200
preflight:
  min_free_disk_gb: 20
