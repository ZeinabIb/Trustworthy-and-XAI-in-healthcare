# Evaluation (Phase 4). Merged into base.yaml; profiles may override eval.bootstrap_B only. Pre-specified.

eval:
  coverages: [0.90, 0.75, 0.50]   # accuracy reported at these coverages
  calibration_bins: 15            # equal-mass bins for ECE / MCE of the profiles
  alpha: 0.05                     # CIs are (1 - alpha); BH false-discovery rate across the 14 findings
  bootstrap_seed: 0
  calib_cv_folds: 5               # y_hat v2 dev path: out-of-fold rule on val (patient-grouped)
  calib_cv_seed: 0                #   fold assignment seed (also the added-value (a) dev CV folds)
  blank_policy: negative          # correctness on y in {0,1} with blank -> 0 (DECISIONS 2026-10-11) | exclude
  r_deciles: 10                   # calibration of R: accuracy within deciles
  lof_neighbors: 20               # LocalOutlierFactor baseline (scikit-learn default)
  reference: mfsi                 # score every baseline is compared with (paired AURC difference, DeLong)
  blank_shift_warn: 0.01          # |macro AURC change| with blanks excluded above this -> STOP-AND-ASK
  exclude_min_pos: 10             # 'exclude blanks' sensitivity only for findings with >= this many explicit
  exclude_min_neg: 10             #   positives and negatives in the split (Zeinab 2026-10-15; also for full)
  added_value:                    # pre-registered secondary analysis (docs/PREREG_ADDED_VALUE.md, 2026-10-15)
    C: 1.0                        # (a) logistic regression, L2, lbfgs
    max_iter: 1000                # (a) solver iterations (convergence only; not a modelling choice)
    min_correct: 10               # (a) eligibility per seed on val
    min_wrong: 10
    cv_folds: 5                   # (a) dev path: patient-grouped CV on val
    quantiles: [0.2, 0.4, 0.6, 0.8]   # (b) MSP quintile edges from val; coinciding edges merged
    min_stratum_correct: 5        # (b) stratum eligibility (fixed on the evaluated sample)
    min_stratum_wrong: 5
    min_strata: 3                 # (b) eligible strata needed for a (finding, seed) value
  sensitivity:                    # plan 4 sensitivity table: each row changes exactly ONE thing from the default
    - {variable: agreement term, variant: 1 - JS, set: {mfsi.agreement: js}}
    - {variable: agreement term, variant: removed (A = 1), set: {mfsi.agreement: none}}
    - {variable: composition, variant: mean of margins, set: {mfsi.combine: mean}}
    - {variable: rare-finding covariance, variant: pooled-target shrinkage, set: {mfsi.covariance: pooled_target}}
    - {variable: rare-finding covariance, variant: Ledoit-Wolf, set: {mfsi.covariance: ledoit_wolf}}
    - {variable: rare-finding covariance, variant: tied (Lee), set: {mfsi.covariance: tied}}
    - {variable: rare-finding covariance, variant: full sample + ridge, set: {mfsi.covariance: sample_ridge}}
    - {variable: cloud construction, variant: U-Ones, set: {mfsi.uncertain_policy: ones}}
    - {variable: distance, variant: Euclidean, set: {mfsi.distance: euclidean}}
    - {variable: distance, variant: LOF, set: {mfsi.distance: lof}}
    - {variable: encoders, variant: contrastively aligned pair, not_run: "aligned model not chosen (deferred, Zeinab 2026-10-15)"}
    - {variable: temperature, variant: tau = 1 (b = 0), set: {mfsi.tau_objective: none}}
    - {variable: text-uninformed findings, variant: naive fallback (one stratum), set: {mfsi.one_witness: naive}}
    - {variable: dimension (2026-10-15), variant: full 1024-d, set: {mfsi.reduce.method: none}}
    - {variable: profile calibration (2026-10-15), variant: "plan tau: global, ECE, no offset", set: {mfsi.tau_objective: ece, mfsi.offset: false, mfsi.tau_scope: global}}
    - {variable: theta_R scope (2026-10-15), variant: per stratum, set: {mfsi.theta_scope: stratum}}
    - {variable: typicality (2026-10-15), variant: typicality (q = 0.05), set: {mfsi.typicality.enabled: true}}
    - {variable: y_hat rule (2026-10-15), variant: Youden + coherent MSP, set: {mfsi.yhat_rule: youden_coherent}, changes_correctness: true}
  controls:                       # validity controls (plan 4)
    confound_bins: 4              # quantile bins of each volume variable (ties merged)
    confound_strong: 0.3          # |Spearman(R, variable)| at or above this in any finding -> rank-normalised R
    uncertain_min: 5              # uncertain-label check only for findings with >= this many y = -1 rows
  degrade:                        # degrade-one-modality test (plan 4 control 3; face validity only)
    seed: 0
    history_sections: [section_clinical_history, section_history]   # dropped by drop_history (index text)
    clean_tolerance: 1.0e-5       # clean re-extraction must match the Phase 2 export (fp32, eval mode)
    variants:
      - {name: blur_s1, modality: image, kind: blur, param: 1}
      - {name: blur_s2, modality: image, kind: blur, param: 2}
      - {name: blur_s4, modality: image, kind: blur, param: 4}
      - {name: occlude_25, modality: image, kind: occlude, param: 0.25}
      - {name: occlude_50, modality: image, kind: occlude, param: 0.50}
      - {name: truncate_25, modality: text, kind: truncate, param: 0.25}
      - {name: truncate_50, modality: text, kind: truncate, param: 0.50}
      - {name: shuffle_sentences, modality: text, kind: shuffle, param: null}
      - {name: drop_history, modality: text, kind: drop_history, param: null}
