# Evaluation (Phase 4). Merged into base.yaml; profiles may override eval.bootstrap_B only. Pre-specified.

eval:
  coverages: [0.90, 0.75, 0.50]   # accuracy reported at these coverages
  calibration_bins: 15            # equal-mass bins for ECE / MCE of the profiles
  alpha: 0.05                     # CIs are (1 - alpha); BH false-discovery rate across the 14 findings
  bootstrap_seed: 0
  blank_policy: negative          # correctness on y in {0,1} with blank -> 0 (DECISIONS 2026-10-11) | exclude
  r_deciles: 10                   # calibration of R: accuracy within deciles
  lof_neighbors: 20               # LocalOutlierFactor baseline (scikit-learn default)
  reference: mfsi                 # score every baseline is compared with (paired AURC difference, DeLong)
  blank_shift_warn: 0.01          # |macro AURC change| with blanks excluded above this -> STOP-AND-ASK
  exclude_min_pos: 10             # 'exclude blanks' sensitivity only for findings with >= this many explicit
  exclude_min_neg: 10             #   positives and negatives in the split (Zeinab 2026-10-15; also for full)
