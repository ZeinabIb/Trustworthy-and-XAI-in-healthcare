[build-system]
requires = ["setuptools==75.6.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mfsi-cxr"
version = "0.0.1"
description = "MFSI (label-free multimodal reliability) and a verified LLM arbiter on CheXpert Plus"
requires-python = ">=3.11,<3.12"
# Exact pins: the same environment must build on the laptop and on the university server.
# torch is the CPU wheel from PyPI here (requirements.lock). The CUDA 12.4 build of the same versions
# (2.5.1+cu124 / 0.20.1+cu124) is pinned in requirements-cu124.lock; install steps in README.md.
dependencies = [
    "numpy==2.1.3",
    "pandas==2.2.3",
    "pyarrow==18.1.0",
    "scipy==1.14.1",
    "scikit-learn==1.5.2",
    "statsmodels==0.14.4",
    "matplotlib==3.9.3",
    "pyyaml==6.0.2",
    "pydicom==3.0.1",
    "pillow==11.0.0",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "transformers==4.46.3",
    "torchxrayvision==1.5.5",   # MIMIC-CXR DenseNet121 (densenet121-res224-mimic_ch)
    "pydantic==2.10.3",         # arbiter output schema (Phase 5)
    "requests==2.34.2",         # arbiter client: local OpenAI-compatible server (Ollama / vLLM)
]

[project.optional-dependencies]
data = [
    "redivis==0.20.15",   # only for scripts/09_fetch_raw.py (data download)
]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["N999"]  # numbered script names like 00_preflight.py

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
